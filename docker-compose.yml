services:
  server:
    build: ./server
    container_name: nexora_server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - server_venv:/app/.venv
    env_file:
      - ./server/.env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_INTERVAL: "0.5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uv run uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  client:
    build: ./client
    container_name: nexora_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: pnpm dev
    depends_on:
      - server

volumes:
  server_venv: